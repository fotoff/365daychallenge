<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Замеры — 365-Дневный Челлендж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --background: hsl(0 0% 100%);
    --foreground: hsl(240 10% 3.9%);
    --card: hsl(0 0% 100%);
    --muted: hsl(240 4.8% 95.9%);
    --muted-foreground: hsl(240 3.8% 46.1%);
    --border: hsl(240 5.9% 90%);
    --input: hsl(240 5.9% 90%);
    --ring: hsl(240 5% 64.9%);
    --primary: hsl(240 5.9% 10%);
    --primary-foreground: hsl(0 0% 98%);
    --destructive: hsl(0 84.2% 60.2%);
    --success: hsl(142 71% 45%);
    --success-light: hsl(142 76% 94%);
    --warn: hsl(38 92% 50%);
    --warn-light: hsl(48 96% 94%);
    --radius: 0.375rem;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--background); color: var(--foreground); line-height: 1.5;
    min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  main { flex: 1; padding: 32px 20px 32px; max-width: 900px; margin: 0 auto; width: 100%; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted-foreground); }
  .back-link { font-size: 13px; color: var(--muted-foreground); text-decoration: none; padding: 6px 12px; border-radius: 9999px; border: 1px solid var(--border); }
  .back-link:hover { background: var(--muted); color: var(--foreground); }

  .user-bar { display: none; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 12px; color: var(--muted-foreground); }
  .user-bar.visible { display: flex; }
  .user-bar .user-name { font-weight: 600; color: var(--foreground); }
  .user-bar .user-code {
    display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px;
    background: var(--muted); font-family: 'SF Mono', ui-monospace, monospace; letter-spacing: 0.1em;
    font-size: 11px; font-weight: 600; color: var(--foreground);
  }

  .reminder {
    padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;
    font-size: 13px; display: flex; align-items: center; gap: 10px;
    border: 1px solid transparent;
  }
  .reminder.warn { background: var(--warn-light); border-color: hsl(38 80% 60%); color: hsl(24 60% 30%); }
  .reminder.ok { background: var(--success-light); border-color: var(--success); color: hsl(142 50% 25%); }
  .reminder.info { background: var(--muted); color: var(--muted-foreground); }
  .reminder i { font-style: normal; font-size: 16px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 20px; }
  .btn {
    padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
    font-family: inherit; cursor: pointer; transition: all 150ms; border: 1px solid var(--border);
    background: var(--card); color: var(--foreground);
  }
  .btn:hover { background: var(--muted); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .btn-primary:hover { background: hsl(240 5.9% 20%); }
  .btn-destructive { color: var(--destructive); border: none; background: transparent; }
  .btn-destructive:hover { background: hsl(0 86% 95%); }

  /* Summary card */
  .summary-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .summary-header {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted-foreground); margin-bottom: 14px;
  }
  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-value { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .stat-unit { font-size: 12px; font-weight: 400; color: var(--muted-foreground); margin-left: 2px; }
  .stat-delta { font-size: 11px; font-weight: 500; margin-top: 1px; }
  .stat-delta.up { color: var(--success); }
  .stat-delta.down { color: var(--destructive); }
  .stat-delta.neutral { color: var(--muted-foreground); }

  /* History */
  .history { margin-top: 24px; }
  .history h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin-bottom: 10px; }
  .entry {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    background: var(--card); cursor: pointer; transition: all 150ms;
  }
  .entry:hover { background: var(--muted); transform: translateY(-1px); }
  .entry-date { font-size: 13px; font-weight: 600; min-width: 100px; }
  .entry-fields { font-size: 12px; color: var(--muted-foreground); flex: 1; line-height: 1.4; }
  .entry-fields b { color: var(--foreground); font-weight: 500; }
  .entry-empty { padding: 40px 20px; text-align: center; color: var(--muted-foreground); font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: hsla(0,0%,0%,0.5); z-index: 50; backdrop-filter: blur(4px); }
  .overlay.active { display: flex; align-items: center; justify-content: center; animation: fadeIn 150ms ease; }
  @keyframes fadeIn { from { opacity: 0 } }
  .dialog {
    background: var(--card); border-radius: 12px; border: 1px solid var(--border);
    padding: 24px; width: 92%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 16px 70px -12px hsla(0,0%,0%,0.25); animation: pop 200ms ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.97) translateY(8px); } }
  .dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .dialog-title { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
  .dialog-close {
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius); border: none; background: transparent; color: var(--muted-foreground);
    cursor: pointer; font-size: 16px;
  }
  .dialog-close:hover { background: var(--muted); color: var(--foreground); }

  .form-section { margin-bottom: 18px; }
  .form-section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted-foreground); margin-bottom: 8px;
  }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
  }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; color: var(--muted-foreground); }
  .form-field .field-input {
    display: flex; align-items: center; gap: 4px;
    border: 1px solid var(--input); border-radius: var(--radius);
    background: transparent; height: 32px; padding: 0 8px; transition: border-color 150ms, box-shadow 150ms;
  }
  .form-field .field-input:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px hsla(240,5%,65%,0.15); }
  .form-field input {
    flex: 1; height: 100%; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 13px; color: var(--foreground); width: 100%; min-width: 0;
  }
  .field-unit { font-size: 11px; color: var(--muted-foreground); }

  .input {
    width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--input);
    border-radius: var(--radius); font-size: 13px; font-family: inherit;
    background: transparent; color: var(--foreground); outline: none;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .input:focus { border-color: var(--ring); box-shadow: 0 0 0 3px hsla(240,5%,65%,0.15); }
  textarea.input { height: 60px; padding: 8px 10px; resize: vertical; font-family: inherit; }

  .dialog-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .dialog-actions .right { display: flex; gap: 8px; }

  .join {
    max-width: 380px; margin: 60px auto; padding: 24px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    text-align: center;
  }
  .join h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .join p { font-size: 13px; color: var(--muted-foreground); margin-bottom: 16px; }
  .join .input { text-transform: uppercase; text-align: center; letter-spacing: 0.2em; font-family: monospace; }

  @media (max-width: 520px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .form-grid { grid-template-columns: repeat(2, 1fr); }
    .entry-date { min-width: 80px; font-size: 12px; }
    .entry-fields { font-size: 11px; }
    main { padding: 20px 14px; }
  }
</style>
</head>
<body>

<main>
  <div class="header">
    <h1>📏 Замеры</h1>
    <a class="back-link" href="/">← Календарь</a>
  </div>

  <div class="user-bar" id="userBar">
    👤 <span class="user-name" id="userNameDisplay"></span>
    <span class="user-code" id="userCodeDisplay"></span>
  </div>

  <!-- Auth-required stub (when no UID) -->
  <div id="joinBox" class="join" style="display:none">
    <h2>Сначала авторизуйся</h2>
    <p>Открой <a href="/" style="color:var(--foreground)">календарь</a>, введи имя или подключись по коду. После этого сюда можно будет записывать замеры.</p>
    <input class="input" id="codeInput" placeholder="XXXXXX" maxlength="6">
    <button class="btn btn-primary" style="margin-top:10px; width:100%" onclick="connectWithCode()">Подключиться по коду</button>
  </div>

  <div id="app" style="display:none">
    <div id="reminder" class="reminder"></div>

    <div class="toolbar">
      <button class="btn btn-primary" onclick="openModal()">＋ Новый замер</button>
    </div>

    <div id="summary"></div>

    <div class="history">
      <h2>История</h2>
      <div id="historyList"></div>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="dialog-header">
      <div class="dialog-title" id="modalTitle">Новый замер</div>
      <button class="dialog-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-section">
      <div class="form-section-title">Дата</div>
      <input type="date" class="input" id="fDate">
    </div>

    <div class="form-section">
      <div class="form-section-title">Тело</div>
      <div class="form-grid">
        <div class="form-field"><label>Вес</label><div class="field-input"><input type="number" step="0.1" id="fWeight"><span class="field-unit">кг</span></div></div>
        <div class="form-field"><label>% жира</label><div class="field-input"><input type="number" step="0.1" id="fBodyFat"><span class="field-unit">%</span></div></div>
        <div class="form-field"><label>Грудь</label><div class="field-input"><input type="number" step="0.5" id="fChest"><span class="field-unit">см</span></div></div>
        <div class="form-field"><label>Талия</label><div class="field-input"><input type="number" step="0.5" id="fWaist"><span class="field-unit">см</span></div></div>
        <div class="form-field"><label>Бёдра</label><div class="field-input"><input type="number" step="0.5" id="fHips"><span class="field-unit">см</span></div></div>
        <div class="form-field"><label>Бицепс</label><div class="field-input"><input type="number" step="0.5" id="fBiceps"><span class="field-unit">см</span></div></div>
        <div class="form-field"><label>Бедро</label><div class="field-input"><input type="number" step="0.5" id="fThigh"><span class="field-unit">см</span></div></div>
        <div class="form-field"><label>Шея</label><div class="field-input"><input type="number" step="0.5" id="fNeck"><span class="field-unit">см</span></div></div>
        <div class="form-field"><label>Икра</label><div class="field-input"><input type="number" step="0.5" id="fCalf"><span class="field-unit">см</span></div></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Сила</div>
      <div class="form-grid">
        <div class="form-field"><label>Жим лёжа 1ПМ</label><div class="field-input"><input type="number" step="0.5" id="fBench"><span class="field-unit">кг</span></div></div>
        <div class="form-field"><label>Присед 1ПМ</label><div class="field-input"><input type="number" step="0.5" id="fSquat"><span class="field-unit">кг</span></div></div>
        <div class="form-field"><label>Становая 1ПМ</label><div class="field-input"><input type="number" step="0.5" id="fDeadlift"><span class="field-unit">кг</span></div></div>
        <div class="form-field"><label>Отжимания макс</label><div class="field-input"><input type="number" id="fPushups"><span class="field-unit">раз</span></div></div>
        <div class="form-field"><label>Подтягивания макс</label><div class="field-input"><input type="number" id="fPullups"><span class="field-unit">раз</span></div></div>
        <div class="form-field"><label>Планка</label><div class="field-input"><input type="number" id="fPlank"><span class="field-unit">сек</span></div></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Кардио</div>
      <div class="form-grid">
        <div class="form-field"><label>Пульс покоя</label><div class="field-input"><input type="number" id="fRestHR"><span class="field-unit">уд/мин</span></div></div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Заметки</div>
      <textarea class="input" id="fNotes" placeholder="Как чувствуешь себя, что заметил…"></textarea>
    </div>

    <div class="dialog-actions">
      <button class="btn btn-destructive" id="deleteBtn" onclick="deleteEntry()" style="display:none">Удалить</button>
      <div class="right" style="margin-left:auto">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="saveEntry()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCAdwWaHpcb2M6Qk9f3WxX9GYv1yny2qlY",
  authDomain: "daychallenge-1572f.firebaseapp.com",
  databaseURL: "https://daychallenge-1572f-default-rtdb.europe-west1.firebasedatabase.app",
  storageBucket: "daychallenge-1572f.firebasestorage.app",
};

let db = null, firebaseReady = false;
try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); firebaseReady = true; }
catch (e) { console.warn('Firebase init failed:', e); }

let userName = localStorage.getItem('challenge365_name') || '';
let userUID = localStorage.getItem('challenge365_uid') || '';
let measurements = [];  // отсортированный по дате desc массив
let editingId = null;

// Периодичность рекомендованных замеров
const REMIND_DAYS = 14;

// Порядок полей + метаданные для сводки и истории
const FIELDS = [
  { key: 'weight',     label: 'Вес',        unit: 'кг',     step: 0.1, betterDir: 'either' },
  { key: 'bodyFat',    label: '% жира',     unit: '%',      step: 0.1, betterDir: 'down' },
  { key: 'chest',      label: 'Грудь',      unit: 'см',     step: 0.5, betterDir: 'either' },
  { key: 'waist',      label: 'Талия',      unit: 'см',     step: 0.5, betterDir: 'down' },
  { key: 'hips',       label: 'Бёдра',      unit: 'см',     step: 0.5, betterDir: 'either' },
  { key: 'biceps',     label: 'Бицепс',     unit: 'см',     step: 0.5, betterDir: 'up' },
  { key: 'thigh',      label: 'Бедро',      unit: 'см',     step: 0.5, betterDir: 'up' },
  { key: 'neck',       label: 'Шея',        unit: 'см',     step: 0.5, betterDir: 'either' },
  { key: 'calf',       label: 'Икра',       unit: 'см',     step: 0.5, betterDir: 'up' },
  { key: 'benchMax',   label: 'Жим 1ПМ',    unit: 'кг',     step: 0.5, betterDir: 'up' },
  { key: 'squatMax',   label: 'Присед 1ПМ', unit: 'кг',     step: 0.5, betterDir: 'up' },
  { key: 'deadliftMax',label: 'Становая',   unit: 'кг',     step: 0.5, betterDir: 'up' },
  { key: 'pushupsMax', label: 'Отжимания',  unit: 'раз',    step: 1,   betterDir: 'up' },
  { key: 'pullupsMax', label: 'Подтягив.',  unit: 'раз',    step: 1,   betterDir: 'up' },
  { key: 'plankSec',   label: 'Планка',     unit: 'сек',    step: 1,   betterDir: 'up' },
  { key: 'restHR',     label: 'Пульс покоя',unit: 'уд/мин', step: 1,   betterDir: 'down' },
];
const FIELDS_BY_KEY = Object.fromEntries(FIELDS.map(f => [f.key, f]));

// ---------- Auth ----------
function initApp() {
  if (!userUID || !userName) {
    document.getElementById('joinBox').style.display = 'block';
    return;
  }
  document.getElementById('userBar').classList.add('visible');
  document.getElementById('userNameDisplay').textContent = userName;
  document.getElementById('userCodeDisplay').textContent = userUID;
  document.getElementById('app').style.display = 'block';
  loadFromFirebase();
}

function connectWithCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (code.length !== 6) { alert('Код из 6 символов'); return; }
  if (!firebaseReady) { alert('Firebase не подключён'); return; }
  db.ref('leaderboard/' + code).once('value').then(snap => {
    const remote = snap.val();
    if (!remote || !remote.name) { alert('Код не найден'); return; }
    userUID = code;
    userName = remote.name;
    localStorage.setItem('challenge365_uid', userUID);
    localStorage.setItem('challenge365_name', userName);
    document.getElementById('joinBox').style.display = 'none';
    initApp();
  }).catch(err => alert('Ошибка: ' + (err && err.message || err)));
}

// ---------- Firebase load/save ----------
function loadFromFirebase() {
  if (!firebaseReady || !userUID) return;
  db.ref('leaderboard/' + userUID + '/measurements').once('value').then(snap => {
    const raw = snap.val();
    measurements = normalizeMeasurements(raw);
    render();
  }).catch(err => {
    console.error('Load failed', err);
    render();
  });
}

function normalizeMeasurements(raw) {
  if (!raw) return [];
  let arr = [];
  if (Array.isArray(raw)) arr = raw.filter(Boolean);
  else if (typeof raw === 'object') arr = Object.values(raw).filter(Boolean);
  arr.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return arr;
}

function saveToFirebase() {
  if (!firebaseReady || !userUID) return Promise.resolve();
  return db.ref('leaderboard/' + userUID + '/measurements').set(measurements);
}

// ---------- Render ----------
function fmtLocalDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateHuman(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function render() {
  renderReminder();
  renderSummary();
  renderHistory();
}

function renderReminder() {
  const el = document.getElementById('reminder');
  if (measurements.length === 0) {
    el.className = 'reminder info';
    el.innerHTML = '<i>👋</i> Замеров пока нет. Сделай первый — так виден прогресс.';
    return;
  }
  const last = measurements[0].date;
  const today = fmtLocalDate(new Date());
  const days = Math.max(0, daysBetween(last, today));
  if (days >= REMIND_DAYS) {
    el.className = 'reminder warn';
    el.innerHTML = `<i>⏰</i> Прошло ${days} дн. с последнего замера — пора мериться (рекомендуется раз в ${REMIND_DAYS} дней).`;
  } else if (days <= 2) {
    el.className = 'reminder ok';
    el.innerHTML = `<i>✅</i> Недавно замерялся${days === 0 ? ' сегодня' : ' ' + days + ' дн. назад'}. Следующий примерно через ${REMIND_DAYS - days} дн.`;
  } else {
    el.className = 'reminder info';
    el.innerHTML = `<i>📅</i> Последний замер ${days} дн. назад. Следующий примерно через ${REMIND_DAYS - days} дн.`;
  }
}

function renderSummary() {
  const el = document.getElementById('summary');
  if (measurements.length === 0) { el.innerHTML = ''; return; }
  const last = measurements[0];
  const prev = measurements[1];
  let html = `<div class="summary-card"><div class="summary-header">Последний замер · ${fmtDateHuman(last.date)}</div><div class="summary-grid">`;
  const fields = FIELDS.filter(f => last[f.key] != null && last[f.key] !== '');
  if (fields.length === 0) html += '<div class="stat-label">Все поля пустые</div>';
  fields.forEach(f => {
    const v = last[f.key];
    let deltaHtml = '';
    if (prev && prev[f.key] != null && prev[f.key] !== '') {
      const d = v - prev[f.key];
      if (Math.abs(d) > 0.001) {
        const sign = d > 0 ? '+' : '';
        let cls = 'neutral';
        if (f.betterDir === 'up') cls = d > 0 ? 'up' : 'down';
        else if (f.betterDir === 'down') cls = d < 0 ? 'up' : 'down';
        deltaHtml = `<div class="stat-delta ${cls}">${sign}${Math.round(d*10)/10} ${f.unit}</div>`;
      }
    }
    html += `<div class="stat">
      <span class="stat-label">${f.label}</span>
      <span class="stat-value">${v}<span class="stat-unit">${f.unit}</span></span>
      ${deltaHtml}
    </div>`;
  });
  html += '</div></div>';
  el.innerHTML = html;
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (measurements.length === 0) {
    el.innerHTML = '<div class="entry-empty">История пуста — нажми «Новый замер»</div>';
    return;
  }
  let html = '';
  measurements.forEach(m => {
    const parts = [];
    FIELDS.forEach(f => {
      if (m[f.key] != null && m[f.key] !== '') {
        parts.push(`<b>${m[f.key]}</b>&nbsp;${f.unit}&nbsp;<span style="opacity:0.7">${f.label.toLowerCase()}</span>`);
      }
    });
    if (m.notes) parts.push(`<span style="opacity:0.6">— ${escapeHtml(m.notes)}</span>`);
    html += `<div class="entry" onclick="openModal('${m.id}')">
      <div class="entry-date">${fmtDateHuman(m.date)}</div>
      <div class="entry-fields">${parts.join(' · ') || '<em>пусто</em>'}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Modal ----------
function openModal(id) {
  editingId = id || null;
  const isEdit = !!id;
  const entry = isEdit ? measurements.find(m => String(m.id) === String(id)) : null;
  document.getElementById('modalTitle').textContent = isEdit ? 'Редактировать замер' : 'Новый замер';
  document.getElementById('deleteBtn').style.display = isEdit ? 'inline-block' : 'none';

  document.getElementById('fDate').value = (entry && entry.date) || fmtLocalDate(new Date());
  FIELDS.forEach(f => {
    const inp = document.getElementById('f' + f.key.charAt(0).toUpperCase() + f.key.slice(1));
    if (inp) inp.value = (entry && entry[f.key] != null) ? entry[f.key] : '';
  });
  document.getElementById('fNotes').value = (entry && entry.notes) || '';

  document.getElementById('overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('active');
  editingId = null;
}

function readForm() {
  const date = document.getElementById('fDate').value;
  if (!date) { alert('Укажи дату'); return null; }
  const entry = { date, notes: document.getElementById('fNotes').value.trim() };
  FIELDS.forEach(f => {
    const inp = document.getElementById('f' + f.key.charAt(0).toUpperCase() + f.key.slice(1));
    if (inp && inp.value !== '') {
      const v = parseFloat(inp.value);
      if (!isNaN(v)) entry[f.key] = v;
    }
  });
  return entry;
}

function saveEntry() {
  const entry = readForm();
  if (!entry) return;
  if (editingId) {
    const idx = measurements.findIndex(m => String(m.id) === String(editingId));
    if (idx >= 0) {
      entry.id = measurements[idx].id;
      entry.createdAt = measurements[idx].createdAt;
      measurements[idx] = entry;
    }
  } else {
    entry.id = Date.now();
    entry.createdAt = entry.id;
    measurements.push(entry);
  }
  measurements.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  saveToFirebase().catch(err => alert('Не удалось сохранить: ' + (err && err.message || err)));
  render();
  closeModal();
}

function deleteEntry() {
  if (!editingId) return;
  if (!confirm('Удалить этот замер?')) return;
  measurements = measurements.filter(m => String(m.id) !== String(editingId));
  saveToFirebase().catch(err => alert('Не удалось удалить: ' + (err && err.message || err)));
  render();
  closeModal();
}

document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('codeInput')?.addEventListener('keydown', e => { if (e.key === 'Enter') connectWithCode(); });

initApp();
</script>
